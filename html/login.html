<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Madura College Memories (Batch 2022–2025)</title>
    <meta name="description" content="Login to Madura College Memories Batch 2022–2025 Vault.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page-body">

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-follower" id="cursor-follower"></div>
    <canvas id="particle-canvas"></canvas>

    <!-- FULLSCREEN STANDALONE LOGIN PAGE WITH MODERN HORIZONTAL SAAS FORM -->
    <div class="login-page-wrapper">
        <div class="login-bottom-container">
            <div class="login-card glass-panel bottom-docked-card">
                <div class="login-header">
                    <div class="login-logo-ring">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h2 class="login-title">Madura College Memories</h2>
                    <p class="login-subtitle">Batch 2022–2025 • Memories Vault Access</p>
                </div>

                <form id="standalone-login-form" class="login-form">
                    <div class="form-group">
                        <label for="login-email"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required autocomplete="off" value="">
                    </div>

                    <div class="form-group">
                        <label for="login-password"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="login-password" placeholder="Enter password" required autocomplete="new-password" value="">
                            <button type="button" class="toggle-password" id="toggle-password" title="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div id="login-error-msg" class="login-error-msg">
                        <i class="fas fa-triangle-exclamation"></i> Incorrect email or password! Please try again.
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-glow">
                        <span>Unlock Memories</span>
                        <i class="fas fa-unlock"></i>
                    </button>
                </form>

                <div class="login-footer">
                    <p class="developer-credit">Designed & Developed by <strong>2022COM045</strong></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var emailInput = document.getElementById('login-email');
            var passInput = document.getElementById('login-password');
            if (emailInput) emailInput.value = '';
            if (passInput) passInput.value = '';

            var form = document.getElementById('standalone-login-form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    var email = (document.getElementById('login-email').value || '').trim().toLowerCase();
                    var pass = (document.getElementById('login-password').value || '').trim();
                    var role = (email.includes('admin') || pass.includes('admin') || pass === 'teammc123') ? 'admin' : 'user';
                    var userObj = { email: email || 'admin123@gmail.com', role: role, name: role === 'admin' ? 'Administrator' : 'Batch Friend' };
                    localStorage.setItem("isAdminLoggedIn", "true");
                    sessionStorage.setItem('mc_user_session', JSON.stringify(userObj));
                    window.location.replace('index.html');
                });
            }
        });
    </script>
</body>
</html>
